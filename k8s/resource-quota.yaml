apiVersion: v1
kind: ResourceQuota
metadata:
  name: autoresearch-quota
  namespace: sbekkerm-autoresearch
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    limits.cpu: "32"
    limits.memory: 128Gi
    requests.nvidia.com/gpu: "2"
    limits.nvidia.com/gpu: "2"
    pods: "10"
    services: "5"
    persistentvolumeclaims: "5"
